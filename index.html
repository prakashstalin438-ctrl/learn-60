<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Title & SEO Meta Tags -->
    <title>Learn60 — GenAI 60-Day Roadmap</title>
    <meta name="description" content="GenAI 60-Day Strong Fresher Roadmap — Personal Learning & Progress Tracker" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#070a13" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Learn60" />
    <meta name="application-name" content="Learn60" />
    
    <!-- PWA Web Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Early PWA Install Prompt Capture & SW Registration -->
    <script>
      window.__pwaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-ready-to-install'));
      });
      window.addEventListener('appinstalled', function() {
        window.__pwaDeferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-was-installed'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[PWA] SW registered:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[PWA] SW registration failed:', err);
            });
        });
      }
    </script>
    
    <!-- Favicons & App Touch Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    
    <!-- Modern Typography: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
      /* Standalone HTML splash fallback before React hydrates */
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #070a13;
        gap: 16px;
        z-index: 9999;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .splash-logo-wrap {
        width: 84px;
        height: 84px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 0 35px rgba(6, 182, 212, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splashPulse 2s infinite ease-in-out;
        background: #0a0f24;
      }
      .splash-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .splash-title {
        font-size: 1.35rem;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.02em;
      }
      .splash-subtitle {
        font-size: 0.78rem;
        font-weight: 600;
        color: #06b6d4;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .splash-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(6, 182, 212, 0.2);
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: splashSpin 0.8s linear infinite;
        margin-top: 8px;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(6, 182, 212, 0.4)); }
        50% { transform: scale(1.04); filter: drop-shadow(0 0 26px rgba(56, 189, 248, 0.7)); }
      }
      @keyframes splashSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash">
        <div class="splash-logo-wrap">
          <img src="/logo.png" alt="Learn60 Official Logo" class="splash-logo" />
        </div>
        <div class="splash-title">Learn60</div>
        <div class="splash-subtitle">GenAI 60-Day Roadmap</div>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
